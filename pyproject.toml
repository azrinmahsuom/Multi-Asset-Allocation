[project]
name = "analysis"
version = "0.1.0"
description = "Evidence-based long-horizon multi-asset ETF allocation for a Singapore-dollar investor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "statsmodels>=0.15.0",
    "yfinance==1.7.0",
    "pypdf>=6.21.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PD", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
